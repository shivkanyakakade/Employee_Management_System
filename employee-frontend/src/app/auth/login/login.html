<div class="login-page">
    <mat-card class="login-card">

        <mat-card-title>
            Login Form
        </mat-card-title>

        <mat-card-content>

            <form [formGroup]="loginform" (ngSubmit)="onSubmit()" autocomplete="off">

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" formControlName="email">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" formControlName="password">
                </mat-form-field>

                <button mat-raised-button color="primary" class="full-width">
                    Login
                </button>

            </form>

            <div class="demo-login">
                <div class="demo-title"> Explore Live Demo </div>
                <div class="demo-subtitle"> Choose a role to fill the demo credentials </div>

                <div class="demo-buttons">

                    <button mat-stroked-button type="button" class="demo-button admin-button" (click)="loginAsAdmin()">
                        <span class="demo-icon">👨‍💼</span> Login as Admin </button>

                    <button mat-stroked-button type="button" class="demo-button employee-button"
                        (click)="loginAsEmployee()"> <span class="demo-icon">👤</span> Login as Employee </button>
                </div>
            </div>

            <!-- <p>
            Don't have an account?

            <a routerLink="/register">
                Register
            </a>
        </p> -->

        </mat-card-content>

    </mat-card>

</div>
