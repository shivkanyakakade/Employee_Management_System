<div class="department-grid">


    <mat-card class="card department-card detailed-card" *ngFor="let dept of departmentcounts"
        [routerLink]="['/employees']" [queryParams]="{ department: dept.name }">

        <mat-card-content>
            <mat-icon class="dept-icon">
                {{ getDepartmentIcon(dept.name) }}
            </mat-icon>

            <h3>{{ dept.name }}</h3>

            <h1>{{ dept.count }}</h1>

            <span class="view-link">
                View {{dept.name}} Employees
                <mat-icon>arrow_forward</mat-icon>
            </span>

        </mat-card-content>

    </mat-card>

</div>
