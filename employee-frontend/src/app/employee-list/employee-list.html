<mat-card>

    <mat-card-title>
        Employee List
    </mat-card-title>
    <hr>


    <mat-form-field appearance="outline">

        <mat-label>Search Employee</mat-label>

        <input matInput [(ngModel)]="searchText" (input)="searchEmployee()">

    </mat-form-field>


    <div class="table-container">

        <table mat-table [dataSource]="dataSource" matSort>

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                <td mat-cell *matCellDef="let emp">
                    {{ emp._id }}
                </td>
            </ng-container>

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let emp">
                    {{ emp.name }}
                </td>
            </ng-container>

            <!-- Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                <td mat-cell *matCellDef="let emp">
                    {{ emp.email }}
                </td>
            </ng-container>

            <!-- Mobile -->
            <ng-container matColumnDef="mobile">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Mobile</th>
                <td mat-cell *matCellDef="let emp">
                    {{ emp.mobile }}
                </td>
            </ng-container>

            <!-- Department -->
            <ng-container matColumnDef="department">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
                <td mat-cell *matCellDef="let emp">
                    {{ emp.department }}
                </td>
            </ng-container>

            <!-- Action -->
            <ng-container matColumnDef="action">

                <th mat-header-cell *matHeaderCellDef>
                    Action
                </th>

                <td mat-cell *matCellDef="let emp">

                    <!-- Admin -->
                    <div class="action-buttons" *ngIf="isAdmin">

                        <button mat-stroked-button class="view-link"  (click)="viewEmployee(emp._id)">
                            View
                        </button>

                        <button mat-stroked-button (click)="editEmployee(emp)">
                            Edit
                        </button> 

                        <button mat-stroked-button (click)="deleteEmployee(emp._id)">
                            Delete
                        </button>
                    </div>

                    <!-- Employee -->
                    <div class="action-buttons" *ngIf="!isAdmin">

                        <button mat-stroked-button class="view-link"  (click)="viewEmployee(emp._id)">
                            View
                        </button>

                        <button *ngIf="emp.email === getEmail" mat-stroked-button
                            (click)="editEmployee(emp)">
                            Edit
                        </button>

                    </div>
                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns">
            </tr>

            <tr mat-row *matRowDef="let row; columns: displayedColumns;">
            </tr>

        </table>

        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5,10,20]" showFirstLastButtons>
        </mat-paginator>
    </div>

</mat-card>
